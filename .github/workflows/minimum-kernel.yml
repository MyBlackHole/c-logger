name: minimum-kernel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/minimum-kernel.yml"
      - "scripts/run_min_kernel_vm.sh"
      - "scripts/min-kernel/**"
      - "tests/integration/test_min_kernel_runtime.c"
      - "xmake.lua"
      - "VERSION"
      - "src/**"
      - "include/**"
      - "abi/**"
      - "tests/packaging/**"
      - "examples/installed_consumer/**"

permissions:
  contents: read

jobs:
  linux-5-4:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install VM and filesystem tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 e2fsprogs xfsprogs

      - name: Validate Ubuntu 20.04 on Linux 5.4 guest
        shell: bash
        run: bash scripts/run_min_kernel_vm.sh min-kernel-evidence

      - name: Upload minimum-kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-kernel-linux-5.4
          path: |
            min-kernel-evidence/platform-evidence.txt
            min-kernel-evidence/serial.log
          if-no-files-found: warn
          retention-days: 30
