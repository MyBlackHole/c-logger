name: stage12-source-transfer
on:
  push:
    branches: [feature/explicit-process-admission-218]
    paths: [.github/workflows/stage12-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'MyBlackHole/c-logger'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: 校验基线及准确源码树，提交后删除临时传输入口
        env:
          DELTA: >-
            
            
            
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/explicit-process-admission-218
          test "$(git rev-parse HEAD^)" = 976580910d578791479088f003316285f39a471b
          git rm .github/workflows/stage12-source-transfer.yml
          test "$(git write-tree)" = f163780c89c2a5709878adbd7624a6646b0e03d0
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os
          from pathlib import Path
          packed = bz2.decompress(base64.b64decode(os.environ['DELTA']))
          assert hashlib.sha256(packed).hexdigest() == '5fe06c9e30665daa1b1ceda9adbef54092b7c693150edd9f4a7196345d67e471'
          strings, entries = json.loads(packed)
          for name, digest, changes in entries:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              original = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(original).hexdigest() == digest, name
              lines = original.decode('utf-8').splitlines(keepends=True)
              for start, end, index in reversed(changes):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = [strings[index]]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(''.join(lines).encode('utf-8'))
          PY
          git add -A
          test "$(git write-tree)" = 7adc406e9d1f0c5430a82218064f9729db7862fa
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: 强制显式进程初始化，普通准入不注册不等待（#218）'
          git push origin HEAD:"$GITHUB_REF"
