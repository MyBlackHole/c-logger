name: release-validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "VERSION"
      - "xmake.lua"
      - "src/**"
      - "include/**"
      - "abi/logger.symbols"
      - "tests/packaging/**"
      - "tests/compat/**"
      - "examples/installed_consumer/**"
      - "scripts/check_release_abi.py"
      - "scripts/check_release_assets.py"
      - "scripts/check_production_artifact.py"
      - ".github/workflows/release-validation.yml"
  push:
    tags:
      - "v*"

jobs:
  package:
    name: xpack (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure Xmake release candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release -o xmake-build \
            --build_shared="$shared" \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \

      - name: Run complete Xmake release suite
        run: xmake test -j1

      - name: Locate production artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find xmake-build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find xmake-build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Inspect production artifact
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: Inspect shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

      - name: Build authoritative XPack TGZ
        run: xmake pack -f targz -o xpack-out

      - name: Verify release asset naming and SHA-256
        run: >-
          python3 scripts/check_release_assets.py
          --directory xpack-out
          --version "${{ steps.version.outputs.version }}"
          --kind "${{ matrix.kind }}"

      - name: Verify packaged install tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          package="$(find xpack-out -maxdepth 1 -type f -name "prod-c-logger-${version}-*-${{ matrix.kind }}.tar.gz" -print -quit)"
          test -n "$package"
          mkdir unpack
          tar -xzf "$package" -C unpack
          header="$(find unpack -type f -path '*/include/logger/logger.h' -print -quit)"
          test -n "$header"
          prefix="$(dirname "$(dirname "$(dirname "$header")")")"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$prefix/lib/liblogger.so.${version}"
          else
            artifact="$prefix/lib/liblogger.a"
          fi
          test -f "$artifact"
          python3 tests/packaging/check_install.py \
            --source . \
            --build xmake-build \
            --artifact "$artifact" \
            --kind "${{ matrix.kind }}" \
            --cc cc \
            --cxx c++ \
            --cmake cmake \
            --installed-prefix "$prefix"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-c-logger-${{ steps.version.outputs.version }}-${{ matrix.kind }}
          path: |
            xpack-out/prod-c-logger-${{ steps.version.outputs.version }}-*-${{ matrix.kind }}.tar.gz
            xpack-out/prod-c-logger-${{ steps.version.outputs.version }}-*-${{ matrix.kind }}.tar.gz.sha256
          if-no-files-found: error
