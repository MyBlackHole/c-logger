name: worker-owner-import
on:
  pull_request:
    paths: ['.github/workflows/worker-owner-import.yml']
permissions:
  contents: read
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/lifecycle-ownership-api-218'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 导入固定的拥有者修复并删除临时入口
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          edits = json.loads(r'''[["tests/regression/test_worker_failure.c",[[8,11,"\tWAIT_FIRST,\n\tERROR_FIRST,\n\tWAIT_GAP,\n\tMULTIPLE,\n\tSPURIOUS,\n\tLATER_SLOT,\n\tSPILL,\n\tNORMAL_GAP,\n\tNORMAL_DRAIN,\n\tBACKEND_ERROR,\n\tEMPTY_TARGET,\n\tGLOBAL,\n\tCANCEL\n"],[21,21,"/* instance 仅供工作线程和包装器借用，独占拥有者槽必须另行保存。 */\n"],[22,22,"static logger_t **owner_slot;\n"],[46,47,"\t\t\t  void *(*)(void *), void *);\n"],[93,94,"\t\t\t  void *(*fn)(void *), void *arg)\n"],[174,175,"\t\t\t      size_t length, const struct timespec *ts,\n\t\t\t      int sync)\n"],[184,184,"\tif (owner_slot)\n\t\tCHECK(*owner_slot == NULL);\n"],[202,202,"\t\tif (owner_slot)\n\t\t\tCHECK(*owner_slot == NULL);\n"],[243,244,"\t\t\t\t     logger_flush_instance_status(instance);\n"],[264,265,"\t\t\t     selected == LATER_SLOT   ? 2 :\n\t\t\t\t\t\t\t1;\n"],[270,271,"\t\tCHECK(!__real_pthread_create(&producer[0], NULL, produce,\n\t\t\t\t\t     NULL));\n"],[277,278,"\t\tCHECK(!__real_pthread_create(&producer[1], NULL, produce,\n\t\t\t\t\t     &count));\n"],[285,286,"\t\tCHECK(!__real_pthread_create(&flushers[i], NULL, flush,\n\t\t\t\t\t     &answers[i]));\n"],[289,290,"\t\t\tawait_count(&answers[i].calls,\n\t\t\t\t    selected == SPURIOUS ? 2 : 1);\n"],[321,323,"\t\t\tint error = !healthy_worker()\t      ? EIO :\n\t\t\t\t    selected == BACKEND_ERROR ? ENOSPC :\n\t\t\t\t\t\t\t\t0;\n"],[355,357,"\t\tCHECK(d.emitted_records ==\n\t\t      (selected == BACKEND_ERROR ? 0u : 1u));\n\t\tCHECK(d.failed_records ==\n\t\t      (selected == BACKEND_ERROR ? 1u : 0u));\n"],[364,367,"\t\t\"wait-first\",\t\"error-first\",\t \"wait-gap\",\t \"multiple\",\n\t\t\"spurious\",\t\"later-slot\",\t \"spill\",\t \"normal-gap\",\n\t\t\"normal-drain\", \"backend-error\", \"empty-target\", \"global\",\n\t\t\"cancel\"\n"],[382,382,"\tlogger_t *owner = NULL;\n"],[394,398,"\t\towner_slot = &owner;\n\t\tCHECK(logger_create(&c, &owner) == 0);\n\t\tCHECK(owner != NULL && owner == instance);\n"],[403,405,"\t\t\tlogger_log(instance, LOGGER_INFO, \"drain\", NULL, 0,\n\t\t\t\t   NULL, \"record %u\", i);\n"],[412,414,"\tint expected = !healthy_worker()\t ? EIO :\n\t\t       selected == BACKEND_ERROR ? ENOSPC :\n\t\t\t\t\t\t   0;\n"],[415,420,"\t/* 销毁先消费公开槽，join/free 探针仍借用活实例观察真正释放。\n\t * Global 关闭尚为 POSIX 错误风格，显式销毁为负错误码并保留 errno。\n\t */\n\tif (selected == GLOBAL) {\n\t\terrno = 0;\n\t\tCHECK(logger_shutdown_status() == (expected ? -1 : 0));\n\t\tCHECK(errno == expected);\n\t} else {\n\t\terrno = EDOM;\n\t\tCHECK(logger_destroy(&owner) == -expected);\n\t\tCHECK(errno == EDOM);\n\t}\n\tCHECK(owner == NULL);\n"]]],["xmake.lua",[[864,864,"    -- 工作线程失败专项也进入完整静态集合，避免只运行外部脚本才发现接口漂移。\n    -- GNU --wrap 只用于真实生产静态归档，不冒称 DSO 内部拦截。\n    if not has_config(\"build_shared\") then\n        target(\"worker_failure_production_regression\")\n            set_kind(\"binary\")\n            set_default(false)\n            add_files(\"tests/regression/test_worker_failure.c\")\n            add_deps(\"logger\")\n            add_includedirs(\"src\")\n            add_cflags(\"-std=gnu11\", \"-Wall\", \"-Wextra\", \"-Wpedantic\", \"-Werror\", {force = true})\n            for _, symbol in ipairs({\"pthread_create\", \"pthread_join\", \"pthread_mutex_lock\",\n                                     \"pthread_mutex_unlock\", \"pthread_cond_wait\", \"pthread_cond_broadcast\",\n                                     \"strrchr\", \"logger_file_writev\", \"logger_runtime_free\"}) do\n                add_ldflags(\"-Wl,--wrap=\" .. symbol, {force = true})\n            end\n            for _, scenario in ipairs({\"wait-first\", \"error-first\", \"wait-gap\", \"multiple\", \"spurious\",\n                                       \"later-slot\", \"spill\", \"normal-gap\", \"normal-drain\", \"backend-error\",\n                                       \"empty-target\", \"global\", \"cancel\"}) do\n                add_tests(scenario, {runargs = scenario, group = \"worker-failure\", timeout = 20})\n            end\n        target_end()\n    end\n\n"]]],["TESTING.md",[[554,554,"\n\n### 工作线程失败与消费式销毁\n\n`xmake test -g worker-failure -j1` 在静态回归配置中将原有十三个工作线程失败场景\n直接链接真实生产归档；`run_worker_failure.sh` 继续独立运行同一份测试源。\n完整静态集合因此不再遗漏这组原先仅由专项脚本执行的测试，共新增十三个注册项。\n\n测试独占拥有者槽与工作线程/释放包装器的借用指针分开：显式销毁先清拥有者槽，\n`join` 和真实映射释放前仍能检查借用对象；最后才能清除借用观测值。\n同时断言负错误码、调用方 errno 保留、提前清槽和恰好一次实际回收。\nGlobal 关闭保留当前 POSIX 返回合同，两者不能用同一个旧 errno 断言混淆。\n没有删除等待者、预留空洞、伪唤醒、错误广播、取消、完成水位或输出计数断言。\n"]]]]''')
          subprocess.run(['git', 'rm', '--', '.github/workflows/worker-owner-import.yml'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '97a75da4ca0dc5d39f588f60729b13ec349ab34f'
          allowed = {'tests/regression/test_worker_failure.c', 'xmake.lua', 'TESTING.md'}
          assert {name for name, _ in edits} == allowed and len(edits) == len(allowed)
          for name, changes in edits:
              p = Path(name)
              lines = p.read_text().splitlines(keepends=True)
              for first, last, replacement in reversed(changes):
                  assert 0 <= first <= last <= len(lines)
                  lines[first:last] = replacement.splitlines(keepends=True)
              p.write_text(''.join(lines))
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'f163780c89c2a5709878adbd7624a6646b0e03d0'
          PY
          git -c user.name='Black Hole' -c user.email='39358316+MyBlackHole@users.noreply.github.com' commit -m 'test: 分离工作线程故障夹具的拥有者和借用指针' -m '当前销毁先清拥有者槽，测试包装器必须使用独立借用指针直至真正释放。保留13个故障场景并加入完整静态Xmake集合，检查负错误码、errno保留、清槽顺序及恰好一次回收。临时入口已删除，源码树与本地受检候选一致。'
          git push origin HEAD:refs/heads/feature/lifecycle-ownership-api-218
