name: release-publish

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "docs/RELEASE_NOTES_*.md"
      - ".github/workflows/release-publish.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.version.outputs.notes }}
      exists: ${{ steps.existing.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE_NOTES_${version}.md"
          test -f "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Check existing GitHub release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: xpack (${{ matrix.kind }})
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure authoritative release build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release -o xmake-build \
            --build_shared="$shared" \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \
            --project_version="${{ needs.prepare.outputs.version }}"

      - name: Run complete Xmake release suite
        run: xmake test -j1

      - name: Locate production artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find xmake-build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find xmake-build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Inspect production artifact
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: Inspect shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

      - name: Build authoritative XPack TGZ
        run: xmake pack -f targz -o xpack-out

      - name: Verify XPack asset
        run: >-
          python3 scripts/check_release_assets.py
          --directory xpack-out
          --version "${{ needs.prepare.outputs.version }}"
          --kind "${{ matrix.kind }}"

      - name: Verify packaged install tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          package="$(find xpack-out -maxdepth 1 -type f -name "prod-c-logger-${version}-*-${{ matrix.kind }}.tar.gz" -print -quit)"
          test -n "$package"
          mkdir unpack
          tar -xzf "$package" -C unpack
          header="$(find unpack -type f -path '*/include/logger/logger.h' -print -quit)"
          test -n "$header"
          prefix="$(dirname "$(dirname "$(dirname "$header")")")"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$prefix/lib/liblogger.so.${version}"
          else
            artifact="$prefix/lib/liblogger.a"
          fi
          test -f "$artifact"
          python3 tests/packaging/check_install.py \
            --source . \
            --build xmake-build \
            --artifact "$artifact" \
            --kind "${{ matrix.kind }}" \
            --cc cc \
            --cxx c++ \
            --cmake cmake \
            --installed-prefix "$prefix"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-c-logger-${{ needs.prepare.outputs.version }}-${{ matrix.kind }}
          path: |
            xpack-out/prod-c-logger-${{ needs.prepare.outputs.version }}-*-${{ matrix.kind }}.tar.gz
            xpack-out/prod-c-logger-${{ needs.prepare.outputs.version }}-*-${{ matrix.kind }}.tar.gz.sha256
          if-no-files-found: error

  cmake-reference:
    name: cmake-reference (${{ matrix.kind }})
    needs: prepare
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: shared
            shared: "ON"
            artifact: "cmake-build/liblogger.so"
          - kind: static
            shared: "OFF"
            artifact: "cmake-build/liblogger.a"
    steps:
      - uses: actions/checkout@v5

      - name: Configure CMake reference build
        run: >-
          cmake -S . -B cmake-build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=ON

      - name: Build CMake reference
        run: cmake --build cmake-build -j2

      - name: Run CMake reference suite
        run: ctest --test-dir cmake-build --output-on-failure -j2

      - name: Validate CMake reference install contract
        run: cmake --build cmake-build --target check-package -j2

      - name: Inspect CMake reference artifact
        run: python3 scripts/check_production_artifact.py "${{ matrix.artifact }}"

      - name: Inspect CMake reference shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ matrix.artifact }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

  publish:
    needs: [prepare, package, cmake-reference]
    if: needs.prepare.outputs.exists != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download validated XPack assets
        uses: actions/download-artifact@v4
        with:
          pattern: prod-c-logger-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        run: >-
          python3 scripts/check_release_assets.py
          --directory release-assets
          --version "${{ needs.prepare.outputs.version }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "c-logger ${version} — Controlled Production Candidate" \
            --notes-file "${{ needs.prepare.outputs.notes }}" \
            --prerelease \
            release-assets/prod-c-logger-${version}-*-shared.tar.gz \
            release-assets/prod-c-logger-${version}-*-shared.tar.gz.sha256 \
            release-assets/prod-c-logger-${version}-*-static.tar.gz \
            release-assets/prod-c-logger-${version}-*-static.tar.gz.sha256

  release-already-exists:
    needs: prepare
    if: needs.prepare.outputs.exists == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ needs.prepare.outputs.tag }} already exists; nothing to publish."
