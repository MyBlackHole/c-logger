name: release-publish

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "docs/RELEASE_NOTES_*.md"
      - ".github/workflows/release-publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          version="$(sed -n 's/^project(prod_c_logger VERSION \([0-9][0-9.]*\) LANGUAGES C)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          notes="docs/RELEASE_NOTES_${version}.md"
          test -f "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Check existing GitHub release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure shared package
        if: steps.existing.outputs.exists != 'true'
        run: >-
          cmake -S . -B build-shared
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTING=ON

      - name: Build and validate shared package
        if: steps.existing.outputs.exists != 'true'
        run: |
          cmake --build build-shared -j2
          cmake --build build-shared --target check-package -j2
          python3 scripts/check_production_artifact.py build-shared/liblogger.so
          python3 scripts/check_release_abi.py build-shared/liblogger.so
          cpack --config build-shared/CPackConfig.cmake -G TGZ

      - name: Configure static package
        if: steps.existing.outputs.exists != 'true'
        run: >-
          cmake -S . -B build-static
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTING=ON

      - name: Build and validate static package
        if: steps.existing.outputs.exists != 'true'
        run: |
          cmake --build build-static -j2
          cmake --build build-static --target check-package -j2
          python3 scripts/check_production_artifact.py build-static/liblogger.a
          cpack --config build-static/CPackConfig.cmake -G TGZ

      - name: Verify package assets
        if: steps.existing.outputs.exists != 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          test -n "$(find . -maxdepth 1 -name "prod-c-logger-${version}-*-shared.tar.gz" -print -quit)"
          test -n "$(find . -maxdepth 1 -name "prod-c-logger-${version}-*-shared.tar.gz.sha256" -print -quit)"
          test -n "$(find . -maxdepth 1 -name "prod-c-logger-${version}-*-static.tar.gz" -print -quit)"
          test -n "$(find . -maxdepth 1 -name "prod-c-logger-${version}-*-static.tar.gz.sha256" -print -quit)"

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "c-logger ${version} — Controlled Production Candidate" \
            --notes-file "${{ steps.version.outputs.notes }}" \
            --prerelease \
            prod-c-logger-${version}-*-shared.tar.gz \
            prod-c-logger-${version}-*-shared.tar.gz.sha256 \
            prod-c-logger-${version}-*-static.tar.gz \
            prod-c-logger-${version}-*-static.tar.gz.sha256

      - name: Release already exists
        if: steps.existing.outputs.exists == 'true'
        run: echo "${{ steps.version.outputs.tag }} already exists; nothing to publish."
