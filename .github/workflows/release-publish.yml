name: release-publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "docs/RELEASE_NOTES_*.md"
      - ".github/workflows/release-publish.yml"

permissions:
  contents: write

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.version.outputs.notes }}
      release_exists: ${{ steps.existing.outputs.release_exists }}
      release_complete: ${{ steps.existing.outputs.release_complete }}
      tag_exists: ${{ steps.existing.outputs.tag_exists }}
      source_ref: ${{ steps.existing.outputs.source_ref }}
      source_sha: ${{ steps.existing.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE_NOTES_${version}.md"
          test -f "$notes"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Resolve release recovery state
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          title="c-logger ${version} — Controlled Production Candidate"

          git fetch --tags --force
          if source_sha="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")"; then
            tag_exists=true
            source_ref="refs/tags/${tag}"
          else
            tag_exists=false
            source_sha="$GITHUB_SHA"
            source_ref="$GITHUB_SHA"
          fi

          release_exists=false
          release_complete=false
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
            if [ "$tag_exists" != true ]; then
              echo "release $tag exists but its git tag cannot be resolved" >&2
              exit 1
            fi

            metadata="$(gh release view "$tag" --json assets,isPrerelease,name)"
            asset_count="$(jq -r '.assets | length' <<<"$metadata")"
            release_name="$(jq -r '.name' <<<"$metadata")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$metadata")"

            rm -rf existing-release-assets
            mkdir -p existing-release-assets
            if [ "$asset_count" = 4 ] \
              && [ "$release_name" = "$title" ] \
              && [ "$is_prerelease" = true ] \
              && gh release download "$tag" --dir existing-release-assets \
              && [ "$(find existing-release-assets -maxdepth 1 -type f | wc -l)" -eq 4 ] \
              && python3 scripts/check_release_assets.py \
                   --directory existing-release-assets \
                   --version "$version"; then
              release_complete=true
            fi
          fi

          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "release_complete=$release_complete" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  package:
    name: xpack (${{ matrix.kind }})
    needs: prepare
    if: needs.prepare.outputs.release_complete != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "${{ needs.prepare.outputs.version }}"
          echo "LOGGER_PROJECT_VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure authoritative release build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release -o xmake-build \
            --build_shared="$shared" \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \

      - name: Run complete Xmake release suite
        run: xmake test -j1

      - name: Locate production artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find xmake-build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find xmake-build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Inspect production artifact
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: Inspect shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

      - name: Build authoritative XPack TGZ
        run: xmake pack -f targz -o xpack-out

      - name: Verify XPack asset
        run: >-
          python3 scripts/check_release_assets.py
          --directory xpack-out
          --version "${{ needs.prepare.outputs.version }}"
          --kind "${{ matrix.kind }}"

      - name: Verify packaged install tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          package="$(find xpack-out -maxdepth 1 -type f -name "prod-c-logger-${version}-*-${{ matrix.kind }}.tar.gz" -print -quit)"
          test -n "$package"
          mkdir unpack
          tar -xzf "$package" -C unpack
          header="$(find unpack -type f -path '*/include/logger/logger.h' -print -quit)"
          test -n "$header"
          prefix="$(dirname "$(dirname "$(dirname "$header")")")"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$prefix/lib/liblogger.so.${version}"
          else
            artifact="$prefix/lib/liblogger.a"
          fi
          test -f "$artifact"
          python3 tests/packaging/check_install.py \
            --source . \
            --build xmake-build \
            --artifact "$artifact" \
            --kind "${{ matrix.kind }}" \
            --cc cc \
            --cxx c++ \
            --cmake cmake \
            --installed-prefix "$prefix"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-c-logger-${{ needs.prepare.outputs.version }}-${{ matrix.kind }}
          path: |
            xpack-out/prod-c-logger-${{ needs.prepare.outputs.version }}-*-${{ matrix.kind }}.tar.gz
            xpack-out/prod-c-logger-${{ needs.prepare.outputs.version }}-*-${{ matrix.kind }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.release_complete != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Download validated XPack assets
        uses: actions/download-artifact@v4
        with:
          pattern: prod-c-logger-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        run: >-
          python3 scripts/check_release_assets.py
          --directory release-assets
          --version "${{ needs.prepare.outputs.version }}"

      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          notes="${{ needs.prepare.outputs.notes }}"
          title="c-logger ${version} — Controlled Production Candidate"

          test "$(cat VERSION)" = "$version"
          shopt -s nullglob
          assets=(
            release-assets/prod-c-logger-${version}-*-shared.tar.gz
            release-assets/prod-c-logger-${version}-*-shared.tar.gz.sha256
            release-assets/prod-c-logger-${version}-*-static.tar.gz
            release-assets/prod-c-logger-${version}-*-static.tar.gz.sha256
          )
          if [ "${#assets[@]}" -ne 4 ]; then
            printf 'expected four validated release assets, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi

          if [ "${{ needs.prepare.outputs.release_exists }}" = true ]; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease
            gh release upload "$tag" --clobber "${assets[@]}"
          elif [ "${{ needs.prepare.outputs.tag_exists }}" = true ]; then
            gh release create "$tag" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease \
              "${assets[@]}"
          else
            gh release create "$tag" \
              --target "${{ needs.prepare.outputs.source_sha }}" \
              --title "$title" \
              --notes-file "$notes" \
              --prerelease \
              "${assets[@]}"
          fi

          rm -rf release-verify
          mkdir -p release-verify
          gh release download "$tag" --dir release-verify
          test "$(find release-verify -maxdepth 1 -type f | wc -l)" -eq 4
          python3 scripts/check_release_assets.py \
            --directory release-verify \
            --version "$version"
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = true
          test "$(gh release view "$tag" --json name --jq '.name')" = "$title"

  release-already-exists:
    needs: prepare
    if: needs.prepare.outputs.release_complete == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ needs.prepare.outputs.tag }} already exists with the complete validated asset set; nothing to publish."
