name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v2.x.y tag to publish or repair (never a branch)"
        required: true
        type: string
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    # Defense in depth if someone later broadens the workflow trigger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'tag' &&
       startsWith(github.ref, 'refs/tags/v2.') && github.event.deleted == false)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.version.outputs.notes }}
      title: ${{ steps.version.outputs.title }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_exists: ${{ steps.existing.outputs.release_exists }}
      release_complete: ${{ steps.existing.outputs.release_complete }}
      authorized: ${{ steps.gate.outputs.authorized }}
      source_sha: ${{ steps.gate.outputs.source_sha }}
      source_tag_oid: ${{ steps.gate.outputs.source_tag_oid }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require an explicit existing release tag
        id: gate
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_DELETED: ${{ github.event.deleted }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF_TYPE" = tag
              test "$EVENT_DELETED" = false
              tag="$GITHUB_REF_NAME"
              test "$GITHUB_REF" = "refs/tags/$tag"
              ;;
            workflow_dispatch)
              tag="$REQUESTED_TAG"
              ;;
            *)
              echo "release requires an explicit tag push or manual tag selection" >&2
              exit 1
              ;;
          esac
          [[ "$tag" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          # Fetch the exact remote tag; a stale local tag or a branch is not enough.
          git fetch --no-tags --force origin \
            "refs/tags/$tag:refs/release-check/selected"
          source_tag_oid="$(git rev-parse --verify refs/release-check/selected)"
          source_sha="$(git rev-parse --verify 'refs/release-check/selected^{commit}')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$source_sha" = "$GITHUB_SHA"
          fi
          # All build inputs now come from this commit, never the dispatch branch.
          git checkout --detach "$source_sha"
          test "$(cat VERSION)" = "${tag#v}"
          grep -Fxq 'local abi_version = "2"' xmake.lua
          grep -Fxq 'local symbol_version = "LOGGER_2.0"' xmake.lua
          grep -Fxq 'local abi_manifest = "abi/logger-2.0.symbols"' xmake.lua
          test -s abi/logger-2.0.symbols
          grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' abi/logger-2.0.symbols
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_tag_oid=$source_tag_oid" >> "$GITHUB_OUTPUT"
          echo "authorized=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE_NOTES_${version}.md"
          test -f "$notes"
          major="${version%%.*}"
          if [ "$major" -eq 0 ]; then
            title="c-logger ${version} — Controlled Production Candidate"
            prerelease=true
          else
            title="c-logger ${version} — Production v${major}"
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Resolve release recovery state
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          title="${{ steps.version.outputs.title }}"
          expected_prerelease="${{ steps.version.outputs.prerelease }}"

          release_exists=false
          release_complete=false
          if gh release view "$tag" >/dev/null 2>&1; then
            release_exists=true
            metadata="$(gh release view "$tag" --json assets,isPrerelease,name)"
            asset_count="$(jq -r '.assets | length' <<<"$metadata")"
            release_name="$(jq -r '.name' <<<"$metadata")"
            is_prerelease="$(jq -r '.isPrerelease' <<<"$metadata")"

            rm -rf existing-release-assets
            mkdir -p existing-release-assets
            if [ "$asset_count" = 4 ] \
              && [ "$release_name" = "$title" ] \
              && [ "$is_prerelease" = "$expected_prerelease" ] \
              && gh release download "$tag" --dir existing-release-assets \
              && [ "$(find existing-release-assets -maxdepth 1 -type f | wc -l)" -eq 4 ] \
              && python3 scripts/check_release_assets.py \
                   --directory existing-release-assets \
                   --version "$version"; then
              release_complete=true
            fi
          fi

          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "release_complete=$release_complete" >> "$GITHUB_OUTPUT"

  package:
    name: xpack (${{ matrix.kind }})
    needs: prepare
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.authorized == 'true' &&
      needs.prepare.outputs.release_complete != 'true'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - name: Install baseline build and inspection tools
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file git pkg-config \
            python3 binutils
          rm -rf /var/lib/apt/lists/*


      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Verify pinned release source
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          SOURCE_TAG_OID: ${{ needs.prepare.outputs.source_tag_oid }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(cat VERSION)" = "$RELEASE_VERSION"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          git fetch --no-tags --force origin \
            "refs/tags/$RELEASE_TAG:refs/release-check/selected"
          test "$(git rev-parse --verify refs/release-check/selected)" = "$SOURCE_TAG_OID"
          test "$(git rev-parse --verify 'refs/release-check/selected^{commit}')" = "$SOURCE_SHA"

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "${{ needs.prepare.outputs.version }}"
          echo "LOGGER_PROJECT_VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Enable Xmake in root-owned container
        shell: bash
        run: |
          set -euo pipefail
          real_xmake="$(command -v xmake)"
          wrapper="$RUNNER_TEMP/xmake-root-bin"
          mkdir -p "$wrapper"
          cat > "$wrapper/xmake" <<EOF
          #!/bin/sh
          case "\${1:-}" in
            f|config|test|install|run|pack)
              task="\$1"
              shift
              exec "$real_xmake" "\$task" --root "\$@"
              ;;
            *)
              exec "$real_xmake" --root "\$@"
              ;;
          esac
          EOF
          chmod +x "$wrapper/xmake"
          echo "$wrapper" >> "$GITHUB_PATH"

      - name: Verify release build baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.31'
          test "$(gcc -dumpversion | cut -d. -f1)" = 9
          getconf GNU_LIBC_VERSION
          gcc --version
          python3 -m unittest discover -s tests/packaging -p 'test_*.py' -v

      - name: Configure authoritative release build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release -o xmake-build --toolchain=gcc \
            --build_shared="$shared" \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \

      - name: Run complete Xmake release suite
        run: xmake test -j1

      - name: Locate production artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find xmake-build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find xmake-build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Inspect production artifact
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: Inspect shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64
          --max-glibc 2.31

      - name: Build authoritative XPack TGZ
        run: xmake pack -f targz -o xpack-out

      - name: Verify XPack asset
        run: >-
          python3 scripts/check_release_assets.py
          --directory xpack-out
          --version "${{ needs.prepare.outputs.version }}"
          --kind "${{ matrix.kind }}"

      - name: Verify packaged install tree
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          package="$(find xpack-out -maxdepth 1 -type f -name "prod-c-logger-${version}-*-${{ matrix.kind }}.tar.gz" -print -quit)"
          test -n "$package"
          mkdir unpack
          tar -xzf "$package" -C unpack
          header="$(find unpack -type f -path '*/include/logger/logger.h' -print -quit)"
          test -n "$header"
          prefix="$(dirname "$(dirname "$(dirname "$header")")")"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$prefix/lib/liblogger.so.${version}"
          else
            artifact="$prefix/lib/liblogger.a"
          fi
          test -f "$artifact"
          python3 tests/packaging/check_install.py \
            --source . \
            --build xmake-build \
            --artifact "$artifact" \
            --kind "${{ matrix.kind }}" \
            --cc cc \
            --cxx c++ \
            --cmake cmake \
            --installed-prefix "$prefix" \
            --max-glibc 2.31 \
            --max-consumer-glibc 2.31

      - uses: actions/upload-artifact@v4
        with:
          name: prod-c-logger-${{ needs.prepare.outputs.version }}-${{ matrix.kind }}
          path: |
            xpack-out/prod-c-logger-${{ needs.prepare.outputs.version }}-*-${{ matrix.kind }}.tar.gz
            xpack-out/prod-c-logger-${{ needs.prepare.outputs.version }}-*-${{ matrix.kind }}.tar.gz.sha256
          if-no-files-found: error

  consume-modern:
    name: packaged consumer ubuntu-24.04 (${{ matrix.kind }})
    needs: [prepare, package]
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.authorized == 'true' &&
      needs.package.result == 'success' && needs.prepare.outputs.release_complete != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: prod-c-logger-*-${{ matrix.kind }}
          path: xpack-out
          merge-multiple: true

      - name: Consume the baseline-built package on a newer userland
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          python3 scripts/check_release_assets.py --directory xpack-out \
            --version "$version" --kind "${{ matrix.kind }}"
          package="$(find xpack-out -maxdepth 1 -type f -name "prod-c-logger-${version}-*-${{ matrix.kind }}.tar.gz" -print -quit)"
          test -n "$package"
          mkdir unpack
          tar -xzf "$package" -C unpack
          header="$(find unpack -type f -path '*/include/logger/logger.h' -print -quit)"
          test -n "$header"
          prefix="$(dirname "$(dirname "$(dirname "$header")")")"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$prefix/lib/liblogger.so.${version}"
          else
            artifact="$prefix/lib/liblogger.a"
          fi
          # The library retains its 2.31 ceiling. Consumers linked here use
          # this newer userland and are not claimed to deploy on glibc 2.31.
          python3 tests/packaging/check_install.py \
            --source . --build consumer-check --artifact "$artifact" \
            --kind "${{ matrix.kind }}" --cc cc --cxx c++ --cmake cmake \
            --installed-prefix "$prefix" --max-glibc 2.31

  publish:
    needs: [prepare, package, consume-modern]
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.authorized == 'true' &&
      needs.package.result == 'success' && needs.consume-modern.result == 'success' &&
      needs.prepare.outputs.release_complete != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Download validated XPack assets
        uses: actions/download-artifact@v4
        with:
          pattern: prod-c-logger-${{ needs.prepare.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release asset set
        run: >-
          python3 scripts/check_release_assets.py
          --directory release-assets
          --version "${{ needs.prepare.outputs.version }}"

      - name: Publish or repair GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="${{ needs.prepare.outputs.tag }}"
          notes="${{ needs.prepare.outputs.notes }}"
          title="${{ needs.prepare.outputs.title }}"
          prerelease="${{ needs.prepare.outputs.prerelease }}"

          [[ "$tag" =~ ^v2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"
          test "$(cat VERSION)" = "$version"
          test "$tag" = "v$version"
          shopt -s nullglob
          assets=(
            release-assets/prod-c-logger-${version}-*-shared.tar.gz
            release-assets/prod-c-logger-${version}-*-shared.tar.gz.sha256
            release-assets/prod-c-logger-${version}-*-static.tar.gz
            release-assets/prod-c-logger-${version}-*-static.tar.gz.sha256
          )
          if [ "${#assets[@]}" -ne 4 ]; then
            printf 'expected four validated release assets, found %s\n' "${#assets[@]}" >&2
            exit 1
          fi

          prerelease_args=()
          if [ "$prerelease" = true ]; then
            prerelease_args=(--prerelease)
          fi

          # Recheck immediately before the first release mutation. No tag creation.
          git fetch --no-tags --force origin \
            "refs/tags/$tag:refs/release-check/selected"
          test "$(git rev-parse --verify refs/release-check/selected)" = \
            "${{ needs.prepare.outputs.source_tag_oid }}"
          test "$(git rev-parse --verify 'refs/release-check/selected^{commit}')" = \
            "${{ needs.prepare.outputs.source_sha }}"

          if [ "${{ needs.prepare.outputs.release_exists }}" = true ]; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file "$notes"
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" --verify-tag \
              --title "$title" \
              --notes-file "$notes" \
              "${prerelease_args[@]}" \
              "${assets[@]}"
          fi

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F prerelease="$prerelease" >/dev/null

          rm -rf release-verify
          mkdir -p release-verify
          gh release download "$tag" --dir release-verify
          test "$(find release-verify -maxdepth 1 -type f | wc -l)" -eq 4
          python3 scripts/check_release_assets.py \
            --directory release-verify \
            --version "$version"
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = "$prerelease"
          test "$(gh release view "$tag" --json name --jq '.name')" = "$title"

  release-already-exists:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.authorized == 'true' &&
      needs.prepare.outputs.release_complete == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ needs.prepare.outputs.tag }} already exists with the complete validated asset set; nothing to publish."
