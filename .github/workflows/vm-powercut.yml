name: vm-powercut

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/vm-powercut.yml"
      - "scripts/run_vm_powercut.py"
      - "tests/vm_powercut.c"
      - "xmake.lua"
      - "VERSION"
      - "src/audit.c"
      - "src/audit_integrity.c"
      - "src/audit_record.c"
      - "src/audit_record.h"
      - "src/audit_recovery.c"
      - "src/audit_internal.h"
      - "src/logger.c"
      - "src/logger_file.c"
      - "src/logger_file.h"
      - "src/logger_file_rename.c"
      - "src/logger_fault.c"
      - "src/logger_fault.h"
      - "include/audit.h"
      - "include/logger.h"
  push:
    branches: [main]
    paths:
      - ".github/workflows/vm-powercut.yml"
      - "scripts/run_vm_powercut.py"
      - "tests/vm_powercut.c"
      - "xmake.lua"
      - "VERSION"
      - "src/audit.c"
      - "src/audit_integrity.c"
      - "src/audit_record.c"
      - "src/audit_record.h"
      - "src/audit_recovery.c"
      - "src/audit_internal.h"
      - "src/logger.c"
      - "src/logger_file.c"
      - "src/logger_file.h"
      - "src/logger_file_rename.c"
      - "src/logger_fault.c"
      - "src/logger_fault.h"
      - "include/audit.h"
      - "include/logger.h"

permissions:
  contents: read

jobs:
  powercut:
    name: powercut (${{ matrix.filesystem }}, ${{ matrix.point }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"filesystem":["ext4","xfs"],"point":["after_checkpoint_commit","file_after_archive_dirsync"]}' || '{"filesystem":["ext4","xfs"],"point":["acknowledged","before_audit_fsync","after_audit_fsync","before_state_rename","after_state_rename","after_checkpoint_commit","file_after_archive_rename","file_after_archive_dirsync","file_after_active_open","file_after_active_dirsync"]}') }}
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Install QEMU, filesystem tools and guest kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 busybox-static cpio linux-image-virtual \
            e2fsprogs xfsprogs kmod zstd

      - name: Build Xmake static test-only guest
        shell: bash
        run: |
          set -euo pipefail
          xmake f -m release -o xmake-build --build_shared=n --build_private_tests=y
          xmake -j2 vm_powercut_guest
          guest="$(find xmake-build -type f -name vm_powercut_guest -print -quit)"
          test -n "$guest"
          cp "$guest" vm_powercut_guest
          file vm_powercut_guest

      - name: Force VM power cut and verify recovery
        shell: bash
        run: |
          set -euo pipefail
          kernel="$(sudo find /boot -maxdepth 1 -name 'vmlinuz-*' ! -name '*azure*' | sort -V | tail -n 1)"
          test -n "$kernel"
          kernel_release="$(basename "$kernel")"
          kernel_release="${kernel_release#vmlinuz-}"
          test -n "$kernel_release"
          test -d "/lib/modules/$kernel_release"
          sudo cp "$kernel" guest-vmlinuz
          sudo chown "$(id -u):$(id -g)" guest-vmlinuz
          python3 scripts/run_vm_powercut.py \
            --kernel guest-vmlinuz \
            --kernel-release "$kernel_release" \
            --binary vm_powercut_guest \
            --filesystem '${{ matrix.filesystem }}' \
            --point '${{ matrix.point }}' \
            --output vm-evidence

      - name: Upload VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-powercut-${{ matrix.filesystem }}-${{ matrix.point }}
          path: vm-evidence/serial-*.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failed rotation disks for diagnosis
        if: failure() && startsWith(matrix.point, 'file_')
        uses: actions/upload-artifact@v4
        with:
          name: failed-disks-${{ matrix.filesystem }}-${{ matrix.point }}
          path: vm-evidence/audit-disk.raw
          compression-level: 9
          retention-days: 7
