name: core-validation

on:
  pull_request:
    paths:
      - "scripts/tool_i18n.py"
      - "scripts/benchmark_fixed_rate.py"
      - "locales/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "xmake.lua"
      - "VERSION"
      - "abi/logger-2.0.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_production_artifact.py"
      - ".github/workflows/core-validation.yml"
      - ".github/workflows/release-publish.yml"

permissions:
  contents: read

env:
  XMAKE_VERSION: "3.1.1"

jobs:
  correctness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          echo "LOGGER_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 运行完整静态库正确性测试集
        run: |
          set -euo pipefail
          xmake f -m release -o core-build \
            --build_shared=n \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y
          # 先执行真实生产归档的失败注入，失败时能看到准确断言位置，
          # 而不是仅靠 Xmake 的批量测试失败摘要定位。
          xmake -j2 logger
          bash tests/regression/run_file_acquisition.sh core-build | tee core-build/file-acquisition.log
          xmake test -j1
      - name: 运行生产 Logger 格式化回归测试
        shell: bash
        run: |
          set -euo pipefail
          xmake -j2 logger
          bash tests/regression/run_logger_format.sh core-build | tee core-build/logger-format.log
      - name: 运行工作线程启动的生产回归测试
        shell: bash
        run: |
          set -euo pipefail
          bash tests/regression/run_worker_startup.sh core-build | tee core-build/worker-startup.log
      - name: 运行工作线程故障的生产回归测试
        shell: bash
        run: |
          set -euo pipefail
          bash tests/regression/run_worker_failure.sh core-build | tee core-build/worker-failure.log
      - name: 验证真实生产库 close 错误与 EINTR 不重试
        shell: bash
        run: |
          set -euo pipefail
          bash tests/regression/run_close_eintr.sh core-build | tee core-build/close-eintr.log
      - name: 真实生产库逐获取点构造回滚与最终释放验证
        shell: bash
        run: |
          set -euo pipefail
          bash tests/regression/run_ctor_resource_failure.sh core-build | tee core-build/ctor-resource.log
      - name: 运行 Global R7 候选/退役对象的生产静态库回归
        shell: bash
        run: |
          set -euo pipefail
          bash tests/regression/run_global_r7.sh core-build | tee core-build/global-r7.log
      - name: 保留精确源码快照与回归证据
        if: always()
        shell: bash
        run: |
          mkdir -p logger-format-evidence
          git rev-parse HEAD > logger-format-evidence/source-commit.txt
          git archive --format=zip HEAD -o logger-format-evidence/source.zip
          cp core-build/logger-format.log logger-format-evidence/ 2>/dev/null || true
          cp core-build/worker-startup.log logger-format-evidence/ 2>/dev/null || true
          cp core-build/worker-failure.log logger-format-evidence/ 2>/dev/null || true
          cp core-build/global-r7.log logger-format-evidence/ 2>/dev/null || true
          cp core-build/close-eintr.log logger-format-evidence/ 2>/dev/null || true
          cp core-build/ctor-resource.log logger-format-evidence/ 2>/dev/null || true
          cp core-build/file-acquisition.log logger-format-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logger-format-source-and-evidence
          path: logger-format-evidence/
          retention-days: 14

  sanitizer:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v5
      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          echo "LOGGER_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 配置运行时检查测试集
        shell: bash
        run: |
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            policies="build.sanitizer.address,build.sanitizer.undefined"
          else
            policies="build.sanitizer.thread"
          fi
          xmake f -m debug -o sanitizer-build \
            --build_shared=n \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \
            --policies="$policies"
      - name: 运行启用运行时检查的静态库测试集
        run: xmake test -j1
      - name: 运行生产 Logger 格式化的 ASan 与 UBSan 回归测试
        if: matrix.sanitizer == 'address-undefined'
        run: |
          xmake -j2 logger
          bash tests/regression/run_logger_format.sh sanitizer-build address,undefined

      - name: 运行启用检查器的工作线程启动生产回归测试
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            sanitizer="address,undefined"
          else
            sanitizer="thread"
          fi
          xmake -j2 logger
          bash tests/regression/run_worker_startup.sh sanitizer-build "$sanitizer"
      - name: 运行启用检查器的工作线程故障生产回归测试
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            sanitizer="address,undefined"
          else
            sanitizer="thread"
          fi
          xmake -j2 logger
          bash tests/regression/run_worker_failure.sh sanitizer-build "$sanitizer"

      - name: 运行生产 close EINTR 正反例的 ASan/UBSan/TSan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            sanitizer="address,undefined"
          else
            sanitizer="thread"
          fi
          xmake -j2 logger
          bash tests/regression/run_close_eintr.sh sanitizer-build "$sanitizer"

      - name: 运行构造资源获取失败的 ASan/UBSan/TSan 真实生产库对照
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            sanitizer="address,undefined"
          else
            sanitizer="thread"
          fi
          xmake -j2 logger
          bash tests/regression/run_ctor_resource_failure.sh sanitizer-build "$sanitizer"

      - name: 文件 fd/DIR 取得失败的真实生产库 ASan/UBSan/TSan 检查
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            sanitizer="address,undefined"
          else
            sanitizer="thread"
          fi
          xmake -j2 logger
          bash tests/regression/run_file_acquisition.sh sanitizer-build "$sanitizer"

      - name: 运行 Global R7 正常/故障路径的生产库运行时检查
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            sanitizer="address,undefined"
          else
            sanitizer="thread"
          fi
          xmake -j2 logger
          bash tests/regression/run_global_r7.sh sanitizer-build "$sanitizer"

  public-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 导出与其他生产构建相同的单一版本身份
        shell: bash
        run: |
          set -euo pipefail
          echo "LOGGER_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 使用 Clang 构建真实生产库的模糊测试目标
        shell: bash
        run: |
          set -euo pipefail
          clang --version | head -n1
          xmake f -m debug -o fuzz-build --toolchain=clang \
            --build_shared=n \
            --policies=build.sanitizer.address,build.sanitizer.undefined \
            --cxflags="-fsanitize-coverage=trace-pc-guard,trace-cmp"
          xmake -j2 logger
          mapfile -t libraries < <(find fuzz-build -type f -name liblogger.a -print)
          test "${#libraries[@]}" -eq 1
          mkdir -p fuzz-evidence/corpus
          # 对真正的 logger 归档自身验证覆盖回调，而不是
          # 只由 fuzz harness 提供可见的覆盖反馈。
          nm -u "${libraries[0]}" > fuzz-evidence/coverage-symbols.txt
          grep -Fq '__sanitizer_cov_trace_pc_guard' fuzz-evidence/coverage-symbols.txt
          clang -std=gnu11 -O1 -g -Wall -Wextra -Wpedantic -Werror \
            -DLOGGER_STATIC_DEFINE=1 -Iinclude -I"fuzz-build/generated" \
            -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer \
            tests/fuzz/public_fuzz.c "${libraries[0]}" -pthread \
            -o fuzz-public
          cp tests/fuzz/corpus/* fuzz-evidence/corpus/
          git rev-parse HEAD > fuzz-evidence/SOURCE_COMMIT
          sha256sum "${libraries[0]}" fuzz-public | tee fuzz-evidence/sha256.txt
      - name: 执行固定种子的有界真实 libFuzzer 与 ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1 timeout 120s ./fuzz-public \
            -seed=107 -runs=3000 -max_len=128 -timeout=10 \
            -artifact_prefix="$PWD/fuzz-evidence/" \
            fuzz-evidence/corpus 2>&1 | tee fuzz-evidence/libfuzzer.log
      - name: 保留种子、源码身份、产物哈希与模糊测试证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-fuzz-evidence
          path: fuzz-evidence/
          retention-days: 14

  shared-abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          echo "LOGGER_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
      - name: 构建共享库生产产物
        run: |
          xmake f -m release -o shared-build --build_shared=y
          xmake -j2 logger
      - name: 验证生产产物与 ABI 接口
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          artifact="$(find shared-build -type f -name "liblogger.so.${version}" -print -quit)"
          test -n "$artifact"
          python3 scripts/check_production_artifact.py "$artifact"
          python3 scripts/check_release_abi.py "$artifact" \
            --abi-version 2 --symbol-version LOGGER_2.0 \
            --machine 'Advanced Micro Devices X86-64' \
            --elf-class ELF64
