name: crash-recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "xmake.lua"
      - "VERSION"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "scripts/check_crash_matrix.py"
      - ".github/workflows/crash-recovery.yml"
  push:
    branches: [main]
    paths:
      - "xmake.lua"
      - "VERSION"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "scripts/check_crash_matrix.py"
      - ".github/workflows/crash-recovery.yml"

permissions:
  contents: read

jobs:
  process-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: shared
            shared: "y"
          - kind: static
            shared: "n"
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure release crash profile
        run: >-
          xmake f -m release -o xmake-build
          --build_shared=${{ matrix.shared }}
          --build_private_tests=y

      - name: Run and verify process-crash recovery three times
        shell: bash
        run: |
          set -uo pipefail
          overall=0

          for attempt in 1 2 3; do
            echo "process-crash attempt=$attempt"
            xmake test -g process-crash -j1 -vD 2>&1 | tee "crash-$attempt.log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              overall=1
            fi
          done

          python3 scripts/check_crash_matrix.py \
            crash-1.log crash-2.log crash-3.log \
            --output crash-matrix.json \
            --junit-dir . || overall=1

          if [ "$overall" -ne 0 ]; then
            exit 1
          fi

      - name: Upload crash recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-recovery-${{ matrix.kind }}
          path: |
            crash-matrix.json
            crash-*.log
            crash-junit-*.xml
            xmake-build/.gens/**/tests/*.stdout.log
            xmake-build/.gens/**/tests/*.errors.log
          if-no-files-found: warn
          retention-days: 30
