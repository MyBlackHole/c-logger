name: crash-recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "scripts/check_crash_matrix.py"
      - ".github/workflows/crash-recovery.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "scripts/check_crash_matrix.py"
      - ".github/workflows/crash-recovery.yml"

permissions:
  contents: read

jobs:
  process-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: shared
            shared: "ON"
          - kind: static
            shared: "OFF"
    steps:
      - uses: actions/checkout@v5

      - name: Configure release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }}

      - name: Build
        run: cmake --build build -j2

      - name: Verify crash test registration
        run: |
          ctest --test-dir build --show-only=json-v1 > crash-matrix.json
          python3 scripts/check_crash_matrix.py crash-matrix.json

      - name: Run process-crash recovery three times
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            ctest --test-dir build -L crash --output-on-failure -j2 \
              --output-junit "crash-junit-${attempt}.xml" \
              2>&1 | tee "crash-${attempt}.log"
          done

      - name: Upload crash recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-recovery-${{ matrix.kind }}
          path: |
            crash-matrix.json
            crash-*.log
            crash-junit-*.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30
