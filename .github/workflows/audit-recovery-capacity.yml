name: audit-recovery-capacity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/audit-recovery-capacity.yml"
      - "xmake.lua"
      - "VERSION"
      - "src/audit_recovery.c"
      - "src/audit_record.c"
      - "src/audit_record.h"
      - "src/audit_integrity.c"
      - "src/audit_internal.h"
      - "tests/regression/test_audit_recovery_capacity.c"
      - "tests/regression/record_support.h"
      - "tests/regression/crypto_support.h"
      - "tests/regression/audit_support.h"
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-recovery-capacity.yml"
      - "xmake.lua"
      - "VERSION"
      - "src/audit_recovery.c"
      - "src/audit_record.c"
      - "src/audit_record.h"
      - "src/audit_integrity.c"
      - "src/audit_internal.h"
      - "tests/regression/test_audit_recovery_capacity.c"
      - "tests/regression/record_support.h"
      - "tests/regression/crypto_support.h"
      - "tests/regression/audit_support.h"

permissions:
  contents: read

jobs:
  archive-limit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure capacity benchmark
        run: >-
          xmake f -m release -o capacity-build
          --build_shared=n
          --build_regression_tests=y

      - name: Build capacity benchmark
        run: xmake -j2 audit_recovery_capacity

      - name: Run 4096-archive characterization
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find capacity-build -type f -name audit_recovery_capacity -print -quit)"
          test -n "$binary"
          "$binary" 4096 | tee audit-recovery-capacity.json
          {
            echo '## Audit recovery capacity'
            echo
            echo '~~~json'
            cat audit-recovery-capacity.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-recovery-capacity
          path: audit-recovery-capacity.json
          if-no-files-found: error
          retention-days: 30
