name: queue-benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/queue-benchmark.yml"
      - "src/logger_queue.c"
      - "src/logger_queue.h"
      - "src/logger_record.h"
      - "src/logger_worker.c"
      - "src/logger.c"
      - "xmake.lua"
      - "tests/bench_matrix.c"
      - "scripts/benchmark.sh"
      - "scripts/compare_queue_benchmark.py"
      - "docs/QUEUE_STORAGE.md"
  push:
    branches: [main]
    paths:
      - "src/logger_queue.c"
      - "src/logger_queue.h"
      - "src/logger_record.h"
      - "src/logger_worker.c"
      - "src/logger.c"
      - "xmake.lua"
      - "tests/bench_matrix.c"
      - "scripts/compare_queue_benchmark.py"

jobs:
  compare:
    runs-on: ubuntu-24.04
    env:
      QUEUE_MEMORY_BASELINE_REF: 23504f104e900419e891b57d7187ca0bcabffdf3
      QUEUE_TUNING_BASELINE_REF: 6b926d59cda3bf176baa10b24e2c84bc49ce7943
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 准备内存基线
        run: >-
          git worktree add ../queue-memory-baseline
          "$QUEUE_MEMORY_BASELINE_REF"

      - name: 准备调优基线
        run: >-
          git worktree add ../queue-tuning-baseline
          "$QUEUE_TUNING_BASELINE_REF"

      - name: 配置 Xmake 候选版本
        run: >-
          xmake f -m release -o build-queue-candidate
          --build_shared=n
          --build_tests=n
          --build_private_tests=n
          --build_regression_tests=n

      - name: 构建候选版本基准测试
        shell: bash
        run: |
          set -euo pipefail
          xmake -vD -j2 bench_matrix
          candidate="$(find build-queue-candidate -type f -name bench_matrix -print -quit)"
          test -n "$candidate"
          echo "QUEUE_CANDIDATE_BIN=$candidate" >> "$GITHUB_ENV"
          file "$candidate"

      - name: 配置内存基线
        run: >-
          cmake -S ../queue-memory-baseline -B build-queue-memory-baseline
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF

      - name: 构建内存基线基准测试
        run: >-
          cmake --build build-queue-memory-baseline
          --target bench_matrix -j2

      - name: 配置调优基线
        run: >-
          cmake -S ../queue-tuning-baseline -B build-queue-tuning-baseline
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF

      - name: 构建调优基线基准测试
        run: >-
          cmake --build build-queue-tuning-baseline
          --target bench_matrix -j2

      - name: 比较内存占用与吞吐量
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: >-
          python3 scripts/compare_queue_benchmark.py
          --memory-baseline-bin build-queue-memory-baseline/bench_matrix
          --throughput-baseline-bin build-queue-tuning-baseline/bench_matrix
          --candidate-bin "$QUEUE_CANDIDATE_BIN"
          --build-configs-differ
          --memory-baseline-ref "$QUEUE_MEMORY_BASELINE_REF"
          --throughput-baseline-ref "$QUEUE_TUNING_BASELINE_REF"
          --threads 1,4,16
          --sizes 64,256,1024,4000
          --records 1000
          --repeats 3
          --default-queue 8192
          --min-memory-reduction 50
          --out-dir benchmark-comparison

      - name: 发布摘要
        if: always()
        run: |
          if [ -f benchmark-comparison/summary.md ]; then
            cat benchmark-comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-benchmark-comparison
          path: benchmark-comparison/
          if-no-files-found: ignore
