name: stage14-source-transfer
on:
  push:
    branches: [feature/default-borrow-integration-218]
    paths: [.github/workflows/stage14-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'MyBlackHole/c-logger'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: 逐文件与整树核对候选，移除临时传输后提交
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feature/default-borrow-integration-218
          test "$(git rev-parse HEAD^)" = 5d3366408d4e00e084e2691c6d4f55fc5b20e246
          python3 - <<'PY'
          import base64, bz2, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path('.stage14-transfer/part' + str(i)).read_text() for i in range(4))
          data = bz2.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '3116b144768dc2239a9cb43a22e54ef6a50e6a0a93d284020d0ee67604c6c16f'
          (Path(os.environ['RUNNER_TEMP']) / 'stage14-delta.json').write_bytes(data)
          PY
          git rm -r .stage14-transfer .github/workflows/stage14-source-transfer.yml
          test "$(git write-tree)" = 7adc406e9d1f0c5430a82218064f9729db7862fa
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          strings, entries = json.loads((Path(os.environ['RUNNER_TEMP']) / 'stage14-delta.json').read_bytes())
          for name, digest, mode, changes in entries:
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == digest, name
              if mode == 'delete':
                  path.unlink()
                  continue
              assert mode in ('100644', '100755'), (name, mode)
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, index in reversed(changes):
                  assert 0 <= start <= end <= len(lines), name
                  lines[start:end] = [strings[index]]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(''.join(lines).encode('utf-8'))
              path.chmod(0o755 if mode == '100755' else 0o644)
          PY
          git add -A
          test "$(git write-tree)" = e7a1f80fbf1ca1bc23242f912ad3611651a2fcf0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: 默认实例仅借用宿主对象，迁移调用方并验证 fork 检测模型（#218）'
          git push origin HEAD:"$GITHUB_REF"
