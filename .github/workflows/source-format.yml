name: 修改源码格式检查
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changed-source:
    # 保留已有 CI 检查身份；同一作业增加完整范围检查。
    name: 新增与修改行格式门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: ${{ github.workspace }}/build/source-format-tmp
      TMP: ${{ github.workspace }}/build/source-format-tmp
      TEMP: ${{ github.workspace }}/build/source-format-tmp
      XMAKE_TMPDIR: ${{ github.workspace }}/build/source-format-tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/build/source-format-pip-cache
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 准备工作区临时与缓存目录
        run: mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装固定版本格式工具
        run: python -m pip install 'clang-format==18.1.8'
      - name: 校验 gettext 翻译目录与语言回归
        run: |
          set -euo pipefail
          # runner 家目录不向 _apt 开放；以当前普通用户只读查询索引，
          # 在工作区下载并解包 GNU gettext，不提权安装或修改宿主权限。
          gettext_root="$GITHUB_WORKSPACE/build/source-format-gettext"
          download_dir="$gettext_root/packages"
          mkdir -p "$download_dir"
          (cd "$download_dir" && apt-get download gettext)
          packages=("$download_dir"/gettext_*.deb)
          test "${#packages[@]}" -eq 1
          dpkg-deb --field "${packages[0]}" Package Version Architecture
          dpkg-deb -x "${packages[0]}" "$gettext_root/root"
          multiarch="$(gcc -print-multiarch)"
          test -n "$multiarch"
          test -d "$gettext_root/root/usr/lib/$multiarch"
          export MSGFMT="$gettext_root/root/usr/bin/msgfmt"
          export LD_LIBRARY_PATH="$gettext_root/root/usr/lib/$multiarch${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          "$MSGFMT" --version
          python scripts/compile_tool_catalog.py --check
          python scripts/test_tool_i18n.py
          python scripts/test_checker_i18n.py
      - name: 运行门禁正反例自测
        run: python scripts/test_source_format.py
      - name: 检查完整 Git 源码范围
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_source_format.py --all --head "$HEAD_SHA"
      - name: 检查新增和修改的源码行
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_source_format.py --base "$BASE_SHA" --head "$HEAD_SHA"
