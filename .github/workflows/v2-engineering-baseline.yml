name: v2-engineering-baseline

on:
  pull_request:
    paths:
      - "locales/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "scripts/**"
      - "xmake.lua"
      - "VERSION"
      - ".github/workflows/v2-engineering-baseline.yml"
      - ".github/pull_request_template.md"
      - "docs/v2/**"
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "scripts/**"
      - "xmake.lua"
      - "VERSION"
      - ".github/workflows/v2-engineering-baseline.yml"

permissions:
  contents: read

env:
  XMAKE_VERSION: "3.1.1"

jobs:
  added-line-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 检查差异中的空白问题
        shell: bash
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: 检查新增源码行
        shell: bash
        run: python3 scripts/check_v2_diff.py "origin/${{ github.base_ref }}"

  toolchain:
    name: ubuntu-20.04 / ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]

    steps:
      - uses: actions/checkout@v5

      - name: 安装构建工具
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang curl git python3
          rm -rf /var/lib/apt/lists/*

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: 在 root 所有的容器中启用 Xmake
        shell: bash
        run: |
          set -euo pipefail
          real_xmake="$(command -v xmake)"
          wrapper="$RUNNER_TEMP/xmake-root-bin"
          mkdir -p "$wrapper"
          cat > "$wrapper/xmake" <<EOF
          #!/bin/sh
          case "\${1:-}" in
            f|config|test|install)
              task="\$1"
              shift
              exec "$real_xmake" "\$task" --root "\$@"
              ;;
            *)
              exec "$real_xmake" --root "\$@"
              ;;
          esac
          EOF
          chmod +x "$wrapper/xmake"
          echo "$wrapper" >> "$GITHUB_PATH"

      - name: 记录编译器基线
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.toolchain }}" in
            gcc)
              gcc --version
              major="$(gcc -dumpversion | cut -d. -f1)"
              test "$major" -ge 9
              ;;
            clang)
              clang --version
              major="$(clang --version | sed -n '1s/.*version \([0-9][0-9]*\).*/\1/p')"
              test -n "$major"
              test "$major" -ge 10
              ;;
          esac
          echo "LOGGER_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: 配置完整静态库测试集
        shell: bash
        run: |
          set -euo pipefail
          xmake f -m release -o "v2-${{ matrix.toolchain }}-build" \
            --toolchain="${{ matrix.toolchain }}" \
            --build_shared=n \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y

      - name: 检查互斥锁错误处理门禁
        run: python3 scripts/check_lock_error_policy.py

      - name: 运行完整静态库测试集
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2-test-evidence
          git rev-parse HEAD > v2-test-evidence/SOURCE_COMMIT
          xmake test -v -j1 2>&1 | tee v2-test-evidence/tests.log

      - name: 保留完整测试输出与源码身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-test-output-${{ matrix.toolchain }}
          path: v2-test-evidence/
          if-no-files-found: warn
          retention-days: 14
