name: xmake-parity

on:
  push:
    branches: [main]
    paths:
      - "scripts/check_asan_runtime.py"
      - ".github/actions/setup-asan-runtime/**"
      - "tools/diagnostics/**"
      - "scripts/tool_i18n.py"
      - "scripts/benchmark_fixed_rate.py"
      - "locales/**"
      - "xmake.lua"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "VERSION"
      - "LICENSE"
      - "abi/logger-2.0.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_production_artifact.py"
      - "scripts/compare_queue_benchmark.py"
      - "scripts/check_release_assets.py"
      - "tests/packaging/check_install.py"
      - "examples/installed_consumer/**"
      - "docs/XMAKE_PARITY.md"
      - ".github/workflows/xmake-parity.yml"
  pull_request:
    paths:
      - "scripts/check_asan_runtime.py"
      - ".github/actions/setup-asan-runtime/**"
      - "tools/diagnostics/**"
      - "scripts/tool_i18n.py"
      - "scripts/benchmark_fixed_rate.py"
      - "locales/**"
      - "xmake.lua"
      - "src/**"
      - "tests/**"
      - "include/**"
      - "tests/packaging/**"
      - "examples/**"
      - "VERSION"
      - "LICENSE"
      - "abi/logger-2.0.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_production_artifact.py"
      - "scripts/compare_queue_benchmark.py"
      - "scripts/check_release_assets.py"
      - "examples/installed_consumer/**"
      - "docs/XMAKE_PARITY.md"
      - ".github/workflows/xmake-parity.yml"

permissions:
  contents: read

jobs:
  # Keep the required-check ID stable; this runs the current ABI 2 contract.
  v1-semantic-abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 配置语义 ABI 契约
        run: xmake f -m release --build_shared=n

      - name: 构建 C 与 C++11 ABI 契约测试
        run: xmake -j2 current_abi_contract_c current_abi_contract_cpp

      - name: 运行 C 与 C++11 ABI 契约测试
        run: |
          xmake run current_abi_contract_c
          xmake run current_abi_contract_cpp

  production-artifact:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 配置构建
        run: |
          if [ "${{ matrix.kind }}" = shared ]; then
            xmake f -m release --build_shared=y
          else
            xmake f -m release --build_shared=n
          fi

      - name: 构建生产产物
        run: xmake -j2 logger

      - name: 定位产物
        id: artifact
        run: |
          version="$(cat VERSION)"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          file "$artifact"

      - name: 验证 fork 排除检查器的测试夹具
        if: matrix.kind == 'static'
        run: python3 tests/packaging/test_production_artifact.py -v

      - name: 验证生产隔离
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: 验证共享库 ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

      - name: 验证共享库版本链接
        if: matrix.kind == 'shared'
        run: |
          version="$(cat VERSION)"
          dir="$(dirname "${{ steps.artifact.outputs.path }}")"
          test -L "$dir/liblogger.so.2"
          test -L "$dir/liblogger.so"
          test "$(readlink "$dir/liblogger.so.2")" = "liblogger.so.${version}"
          test "$(readlink "$dir/liblogger.so")" = "liblogger.so.2"


  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 配置核心测试
        run: xmake f -m debug --build_shared=n --build_tests=y

      - name: 运行链接生产库的核心测试
        run: xmake test -j2


  private-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 配置仅测试支持用例
        run: xmake f -m release --build_shared=n --build_private_tests=y

      - name: 运行仅测试支持用例
        run: xmake test -j1


  aux-targets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 验证生产基准构建与回归边界
        run: python3 tests/scripts/test_benchmark_build.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-build-evidence
          path: benchmark-build-evidence/
          if-no-files-found: error

      - name: 配置辅助目标
        run: xmake f -m release --build_shared=n --build_regression_tests=y

      - name: 构建辅助工具与示例
        run: >-
          xmake -j2
          bench_logger
          multi_instance_example
          syslog_client_example


  regression-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 配置回归测试支持
        run: xmake f -m release --build_shared=n --build_regression_tests=y

      - name: 运行回归支持用例
        run: xmake test -j1

      - name: 验证锁跟踪翻译单元的宏配置正反例
        shell: bash
        run: |
          set -euo pipefail
          generated="$(find build -type f -name logger_version.h -print -quit)"
          test -n "$generated"
          flags=(-std=gnu11 -DLOGGER_STATIC_DEFINE=1 -Iinclude -Isrc "-I$(dirname "$generated")" -fsyntax-only)
          # 用真实测试源码而非手写无关的宏片段检验编译模式。
          cc "${flags[@]}" -DLOGGER_ENABLE_LOCKDEP=1 tests/regression/test_lockdep.c
          if cc "${flags[@]}" -DLOGGER_ENABLE_LOCKDEP=0 tests/regression/test_lockdep.c > lockdep-disabled.log 2>&1; then
            echo "错误：禁用 Lockdep 的测试翻译单元不应编译通过" >&2
            exit 1
          fi
          grep -F 'lockdep regression requires LOGGER_ENABLE_LOCKDEP=1' lockdep-disabled.log



  # Keep the historical job id stable for branch-protection continuity, but
  # exercise the complete default-static test surface rather than only core tests.
  sanitizer-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v5

      - name: 导出项目版本
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: 配置 Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: 验收已修复的 ASan 运行库
        if: matrix.sanitizer == 'address-undefined'
        uses: ./.github/actions/setup-asan-runtime
      - name: 配置启用运行时检查的静态库测试集
        shell: bash
        run: |
          set -euo pipefail
          toolchain=()
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            policies="build.sanitizer.address,build.sanitizer.undefined"
            toolchain=(--toolchain=clang --cc="$CC" --cxx="$CXX" --ld="$CXX" --sh="$CXX")
          else
            policies="build.sanitizer.thread"
          fi
          xmake f -P . "${toolchain[@]}" -m debug \
            \
            --build_shared=n \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \
            --policies="$policies"

      # CMake uses ctest -j2, but also assigns every case its own working
      # directory. Until Xmake has the same global isolation, serialize the
      # complete suite; the concurrency regressions still create real threads.
      - name: 验证 TSan fork 映射模型及真实错误反例
        if: matrix.sanitizer == 'thread'
        shell: bash
        run: |
          set -euo pipefail
          xmake -j2 fork_tsan_model
          mapfile -t programs < <(find build -type f -name fork_tsan_model)
          test "${#programs[@]}" -eq 1
          python3 scripts/check_tsan_fork_model.py --binary "${programs[0]}" --output tsan-fork-model
      - name: 保留 TSan fork 模型正反例
        if: always() && matrix.sanitizer == 'thread'
        uses: actions/upload-artifact@v4
        with:
          name: tsan-fork-model
          path: tsan-fork-model/
          if-no-files-found: error

      - name: 运行启用运行时检查的静态库测试集
        run: xmake test -j1

      # Sanitizer builds must keep the production archive free of test hooks.
      - name: 验证启用检查器的生产隔离
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find build -type f -name 'liblogger.a' -print -quit)"
          test -n "$artifact"
          python3 scripts/check_production_artifact.py "$artifact"

      - name: 保留 ASan 运行库验收证据
        if: always() && matrix.sanitizer == 'address-undefined'
        uses: actions/upload-artifact@v4
        with:
          name: asan-runtime-qualification
          path: asan-runtime-evidence/
          retention-days: 30
          if-no-files-found: error
