name: xmake-parity

on:
  push:
    branches: [main]
    paths:
      - "xmake.lua"
      - "src/**"
      - "include/**"
      - "VERSION"
      - "cmake/logger.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_production_artifact.py"
      - "scripts/check_release_assets.py"
      - "tests/packaging/check_install.py"
      - "examples/installed_consumer/**"
      - "docs/XMAKE_PARITY.md"
      - ".github/workflows/xmake-parity.yml"
  pull_request:
    paths:
      - "xmake.lua"
      - "src/**"
      - "include/**"
      - "VERSION"
      - "cmake/logger.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_production_artifact.py"
      - "scripts/check_release_assets.py"
      - "tests/packaging/check_install.py"
      - "examples/installed_consumer/**"
      - "docs/XMAKE_PARITY.md"
      - ".github/workflows/xmake-parity.yml"

permissions:
  contents: read

jobs:
  production-artifact:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure
        run: |
          if [ "${{ matrix.kind }}" = shared ]; then
            xmake f -m release --build_shared=y
          else
            xmake f -m release --build_shared=n
          fi

      - name: Build production artifact
        run: xmake -j2 logger

      - name: Locate artifact
        id: artifact
        run: |
          version="$(cat VERSION)"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          file "$artifact"

      - name: Verify production isolation
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: Verify shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

      - name: Verify shared version links
        if: matrix.kind == 'shared'
        run: |
          version="$(cat VERSION)"
          dir="$(dirname "${{ steps.artifact.outputs.path }}")"
          test -L "$dir/liblogger.so.0"
          test -L "$dir/liblogger.so"
          test "$(readlink "$dir/liblogger.so.0")" = "liblogger.so.${version}"
          test "$(readlink "$dir/liblogger.so")" = "liblogger.so.0"


  install-parity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure install candidate
        run: |
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release -o xmake-build --build_shared="$shared"

      - name: Build production artifact
        run: xmake -j2 logger

      - name: Verify installed consumer contract
        shell: bash
        run: |
          version="$(cat VERSION)"
          set -euo pipefail
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find xmake-build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find xmake-build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          python3 tests/packaging/check_install.py             --source .             --build xmake-build             --artifact "$artifact"             --kind "${{ matrix.kind }}"             --cc cc             --cxx c++             --cmake cmake             --install-driver xmake             --xmake xmake


  package-parity:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure package candidate
        run: |
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release -o xmake-build --build_shared="$shared"

      - name: Build XPack TGZ and checksum
        run: xmake pack -f targz -o xpack-out

      - name: Verify release asset naming and SHA-256
        run: >-
          python3 scripts/check_release_assets.py
          --directory xpack-out
          --version "$(cat VERSION)"
          --kind "${{ matrix.kind }}"

      - name: Verify packaged install tree
        shell: bash
        run: |
          version="$(cat VERSION)"
          set -euo pipefail
          package="$(find xpack-out -maxdepth 1 -type f -name "prod-c-logger-${version}-*-${{ matrix.kind }}.tar.gz" -print -quit)"
          test -n "$package"
          mkdir unpack
          tar -xzf "$package" -C unpack
          header="$(find unpack -type f -path '*/include/logger/logger.h' -print -quit)"
          test -n "$header"
          prefix="$(dirname "$(dirname "$(dirname "$header")")")"
          test -f "$prefix/share/doc/prod_c_logger/API.md"
          test -f "$prefix/share/doc/prod_c_logger/docs/XMAKE_PARITY.md"
          test ! -e "$prefix/share/doc/prod_c_logger/docs/HISTORY_API.md"
          test ! -e "$prefix/share/doc/prod_c_logger/docs/HISTORY_README.md"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$prefix/lib/liblogger.so.${version}"
          else
            artifact="$prefix/lib/liblogger.a"
          fi
          test -f "$artifact"
          python3 tests/packaging/check_install.py             --source .             --build xmake-build             --artifact "$artifact"             --kind "${{ matrix.kind }}"             --cc cc             --cxx c++             --cmake cmake             --installed-prefix "$prefix"


  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure core tests
        run: xmake f -m debug --build_shared=n --build_tests=y

      - name: Run production-linked core tests
        run: xmake test -j2


  private-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure test-only support cases
        run: xmake f -m release --build_shared=n --build_private_tests=y

      - name: Run test-only support cases
        run: xmake test -j1


  process-crash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure process-crash parity
        run: |
          if [ "${{ matrix.kind }}" = shared ]; then
            shared=y
          else
            shared=n
          fi
          xmake f -m release --build_shared="$shared" --build_private_tests=y

      - name: Run nine process-crash cases three times
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            "crash_recovery_test/crash_after_audit_fsync"
            "crash_recovery_test/crash_before_state_rename"
            "crash_recovery_test/crash_after_state_rename"
            "crash_recovery_test/crash_after_checkpoint_commit"
            "audit_rotation_crash_regression/rotation_crash_sha256"
            "file_audit_regression/file_crash_sha256_file_after_archive_rename"
            "file_audit_regression/file_crash_sha256_file_after_archive_dirsync"
            "file_audit_regression/file_crash_sha256_file_after_active_open"
            "file_audit_regression/file_crash_sha256_file_after_active_dirsync"
          )
          test "${#tests[@]}" -eq 9
          for attempt in 1 2 3; do
            for test_name in "${tests[@]}"; do
              echo "attempt=${attempt} test=${test_name}"
              xmake test "${test_name}"
            done
          done


  aux-targets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure auxiliary targets
        run: xmake f -m release --build_shared=n --build_regression_tests=y

      - name: Build auxiliary tools and examples
        run: >-
          xmake -j2
          bench_logger
          multi_instance_example
          syslog_client_example
          crypto_chain_tool


  legacy-fork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure legacy fork regression profile
        run: >-
          xmake f -m release
          --build_shared=n
          --legacy_fork=y
          --build_regression_tests=y

      - name: Build legacy fork example
        run: xmake -j2 fork_reinit_example

      - name: Run legacy fork regression cases
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(
            async sync drain no-init console-only after-shutdown context raw-guard
            thread-busy explicit-busy explicit-only audit-busy proc-failure fork-failure
            io-failure close-failure creation-failure registration-failure earlier-handler
            nested repeat explicit-recreate audit-conflict
          )
          test "${#scenarios[@]}" -eq 23
          for scenario in "${scenarios[@]}"; do
            xmake test "fork_reinit_regression/fork_reinit_${scenario}"
          done


  regression-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure regression support
        run: xmake f -m release --build_shared=n --build_regression_tests=y

      - name: Run regression-support cases
        run: xmake test -j1


  # Keep the historical job id stable for branch-protection continuity, but
  # exercise the complete default-static test surface rather than only core tests.
  sanitizer-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure sanitized static suite
        run: |
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            policies="build.sanitizer.address,build.sanitizer.undefined"
          else
            policies="build.sanitizer.thread"
          fi
          xmake f -m debug \
            \
            --build_shared=n \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \
            --policies="$policies"

      # CMake uses ctest -j2, but also assigns every case its own working
      # directory. Until Xmake has the same global isolation, serialize the
      # complete suite; the concurrency regressions still create real threads.
      - name: Run sanitized static suite
        run: xmake test -j1

      # Mirrors CMake's crypto_production_artifact_isolation test, which remains
      # registered in sanitizer builds even though install/packaging tests do not.
      - name: Verify sanitized production isolation
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find build -type f -name 'liblogger.a' -print -quit)"
          test -n "$artifact"
          python3 scripts/check_production_artifact.py "$artifact"
