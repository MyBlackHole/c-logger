name: xmake-parity

on:
  push:
    branches: [main]
    paths:
      - "xmake.lua"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "examples/**"
      - "VERSION"
      - "LICENSE"
      - "abi/logger-2.0.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_v1_abi_snapshot.py"
      - "scripts/check_production_artifact.py"
      - "scripts/check_release_assets.py"
      - "tests/packaging/check_install.py"
      - "examples/installed_consumer/**"
      - "docs/XMAKE_PARITY.md"
      - ".github/workflows/xmake-parity.yml"
  pull_request:
    paths:
      - "xmake.lua"
      - "src/**"
      - "tests/**"
      - "include/**"
      - "tests/packaging/**"
      - "tests/compat/**"
      - "examples/**"
      - "VERSION"
      - "LICENSE"
      - "abi/logger-2.0.symbols"
      - "scripts/check_release_abi.py"
      - "scripts/check_v1_abi_snapshot.py"
      - "scripts/check_production_artifact.py"
      - "scripts/check_release_assets.py"
      - "examples/installed_consumer/**"
      - "docs/XMAKE_PARITY.md"
      - ".github/workflows/xmake-parity.yml"

permissions:
  contents: read

jobs:
  v1-semantic-abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure semantic ABI contract
        run: xmake f -m release --build_shared=n

      - name: Build C and C++11 ABI contracts
        run: xmake -j2 v1_abi_contract_c v1_abi_contract_cpp

      - name: Run C and C++11 ABI contracts
        run: |
          xmake run v1_abi_contract_c
          xmake run v1_abi_contract_cpp

  production-artifact:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [shared, static]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure
        run: |
          if [ "${{ matrix.kind }}" = shared ]; then
            xmake f -m release --build_shared=y
          else
            xmake f -m release --build_shared=n
          fi

      - name: Build production artifact
        run: xmake -j2 logger

      - name: Locate artifact
        id: artifact
        run: |
          version="$(cat VERSION)"
          if [ "${{ matrix.kind }}" = shared ]; then
            artifact="$(find build -type f -name "liblogger.so.${version}" -print -quit)"
          else
            artifact="$(find build -type f -name 'liblogger.a' -print -quit)"
          fi
          test -n "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          file "$artifact"

      - name: Verify fork exclusion checker fixtures
        if: matrix.kind == 'static'
        run: python3 tests/packaging/test_production_artifact.py -v

      - name: Verify production isolation
        run: python3 scripts/check_production_artifact.py "${{ steps.artifact.outputs.path }}"

      - name: Verify shared ABI
        if: matrix.kind == 'shared'
        run: >-
          python3 scripts/check_release_abi.py "${{ steps.artifact.outputs.path }}"
          --machine 'Advanced Micro Devices X86-64'
          --elf-class ELF64

      - name: Verify shared version links
        if: matrix.kind == 'shared'
        run: |
          version="$(cat VERSION)"
          dir="$(dirname "${{ steps.artifact.outputs.path }}")"
          test -L "$dir/liblogger.so.2"
          test -L "$dir/liblogger.so"
          test "$(readlink "$dir/liblogger.so.2")" = "liblogger.so.${version}"
          test "$(readlink "$dir/liblogger.so")" = "liblogger.so.2"


  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure core tests
        run: xmake f -m debug --build_shared=n --build_tests=y

      - name: Run production-linked core tests
        run: xmake test -j2


  private-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure test-only support cases
        run: xmake f -m release --build_shared=n --build_private_tests=y

      - name: Run test-only support cases
        run: xmake test -j1


  aux-targets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure auxiliary targets
        run: xmake f -m release --build_shared=n --build_regression_tests=y

      - name: Build auxiliary tools and examples
        run: >-
          xmake -j2
          bench_logger
          multi_instance_example
          syslog_client_example
          crypto_chain_tool


  regression-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure regression support
        run: xmake f -m release --build_shared=n --build_regression_tests=y

      - name: Run regression-support cases
        run: xmake test -j1


  # Keep the historical job id stable for branch-protection continuity, but
  # exercise the complete default-static test surface rather than only core tests.
  sanitizer-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address-undefined, thread]
    steps:
      - uses: actions/checkout@v5

      - name: Export project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "LOGGER_PROJECT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.1.1"

      - name: Configure sanitized static suite
        run: |
          if [ "${{ matrix.sanitizer }}" = address-undefined ]; then
            policies="build.sanitizer.address,build.sanitizer.undefined"
          else
            policies="build.sanitizer.thread"
          fi
          xmake f -m debug \
            \
            --build_shared=n \
            --build_tests=y \
            --build_private_tests=y \
            --build_regression_tests=y \
            --policies="$policies"

      # CMake uses ctest -j2, but also assigns every case its own working
      # directory. Until Xmake has the same global isolation, serialize the
      # complete suite; the concurrency regressions still create real threads.
      - name: Run sanitized static suite
        run: xmake test -j1

      # Mirrors CMake's crypto_production_artifact_isolation test, which remains
      # registered in sanitizer builds even though install/packaging tests do not.
      - name: Verify sanitized production isolation
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find build -type f -name 'liblogger.a' -print -quit)"
          test -n "$artifact"
          python3 scripts/check_production_artifact.py "$artifact"
