name: lifecycle-api-import

on:
  pull_request:
    paths:
      - '.ci-import/lifecycle-*.txt'
      - '.github/workflows/lifecycle-api-import.yml'

permissions:
  contents: read

jobs:
  import-reviewed-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/lifecycle-ownership-api-218'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: 导入已验证源码并删除临时搬运文件
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          parts = [Path('.ci-import/lifecycle-%d.txt' % i) for i in range(3)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '66726aa2d18a3c9ced6f38e2388223c148f73ce4b0b22093a64d34b6ff79e49a'
          data = json.loads(lzma.decompress(packed))
          assert data['base_tree'] == 'bf75cc0d11cf2d79dfdd376773cf1f6e0daec00c'
          assert data['result_tree'] == '435e5b702b194975ace3d674fa9b0bf30579de89'
          subprocess.run(['git', 'rm', '--', *map(str, parts), '.github/workflows/lifecycle-api-import.yml'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == data['base_tree']
          paths = []
          for name, edits in data['changes']:
              p = Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] not in ('.git', '.github', '.ci-import')
              assert name not in paths
              lines = p.read_text().splitlines(keepends=True) if p.exists() else []
              for first, last, replacement in reversed(edits):
                  assert 0 <= first <= last <= len(lines)
                  lines[first:last] = replacement.splitlines(keepends=True)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(''.join(lines))
              paths.append(name)
          assert len(paths) == 89
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          actual = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert actual == data['result_tree'], actual
          print('IMPORTED_SOURCE_TREE=' + actual)
          PY
          git -c user.name='Black Hole' -c user.email='39358316+MyBlackHole@users.noreply.github.com' commit -m 'feat: 迁移创建与消费式销毁接口及全部当前消费方' -m '关联 #218。导入的完整源码树与本地已验证候选一致；临时搬运文件和本工作流均已删除。最终门禁须由准确提交单独触发，不以本导入成功冒充运行验收。'
          git push origin HEAD:refs/heads/feature/lifecycle-ownership-api-218
