name: fork-runtime-validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'xmake.lua'
      - '.github/workflows/fork-runtime-validation.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'xmake.lua'
      - '.github/workflows/fork-runtime-validation.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      - name: 保存固定工具与源码身份
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/tools
          git rev-parse HEAD > evidence/source-commit.txt
          git rev-parse HEAD^{tree} > evidence/source-tree.txt
          xmake --version > evidence/xmake.txt
          gcc --version > evidence/gcc.txt
          curl --fail --location --retry 3 \
            https://github.com/xmake-io/xmake/releases/download/v3.1.1/xmake-bundle-v3.1.1.linux.x86_64 \
            -o evidence/tools/xmake
          echo 'fe1da8861a5ee5845d4f6c84e499f6f9c6bf5b5a69c9b7b130930ee28355a6d5  evidence/tools/xmake' | sha256sum -c -
          python3 -m pip download --only-binary=:all: --no-deps \
            --dest evidence/tools clang-format==18.1.8
          sha256sum evidence/tools/* > evidence/tools.sha256
          echo "LOGGER_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: logger-runtime-fixed-tools
          path: evidence/
          retention-days: 7
      - name: 拒绝缺失的运行域测试
        run: |
          test -f src/logger_runtime.c
          test -f tests/test_fork_reinit.c
          test -f tests/regression/test_fork_runtime.c
      - name: 运行完整静态测试与生产隔离检查
        shell: bash
        run: |
          set -euo pipefail
          xmake f -y -m debug -o runtime-build \
            --build_shared=n --build_tests=y --build_private_tests=y \
            --build_regression_tests=y
          xmake test -v -j1 2>&1 | tee evidence/xmake-tests.log
          mapfile -t archives < <(find runtime-build -type f -name liblogger.a)
          test "${#archives[@]}" -eq 1
          python3 scripts/check_production_artifact.py "${archives[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logger-runtime-validation
          path: evidence/
          retention-days: 30
