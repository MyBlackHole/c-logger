name: console-api-import

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/console-api-import.yml'
      - '.github/console-api-transfer-*.b64'

permissions:
  contents: read

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/console-status-api-218'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: 仅导入已冻结的 Console 变更并移除传输工具
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: feature/console-status-api-218
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 979833b33c0a36a9f04e1aa4cb1eba9d7146b4ff
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          parts = [Path('.github/console-api-transfer-%d.b64' % i).read_text().strip() for i in range(4)]
          patch = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          assert len(patch) == 71713
          assert hashlib.sha256(patch).hexdigest() == 'c467ce5522b14bc03ec47a1b56682faf8f5ed24bf649566fd55d8dd5a05e820e'
          Path(os.environ['RUNNER_TEMP'], 'console-api.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/console-api.patch"
          git apply "$RUNNER_TEMP/console-api.patch"
          rm .github/console-api-transfer-{0,1,2,3}.b64
          rm .github/workflows/console-api-import.yml
          git add --all
          test "$(git write-tree)" = f5ce4ec064efaa7f3e2ced4f10901c9544fbbc46
          git diff --cached --check
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: 统一 Console 状态与终端查询接口，迁移全部消费方 (#218)' -m '准确补丁与源码树已核对。删除本次临时传输工具；此导入不是功能验收，最终提交须独立运行全部适用门禁。'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree}
